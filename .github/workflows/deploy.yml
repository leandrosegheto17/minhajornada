# Deploy do leitor (PWA estática, AD-001). ÚNICO lugar com `wrangler deploy`.
#
# Gatilho: só manual (workflow_dispatch). Rodado na `desenvolvimento`, publica o staging (tst); rodado na `main`,
# publica a produção. Publica a ponta da branch no momento do disparo (github.sha).
# Disparo: `gh workflow run deploy --ref desenvolvimento` (tst) ou `--ref main` (produção).
#
# O job `conferir` (sem segredo) só deixa seguir se o workflow `ci` desse SHA, num push à mesma branch, terminou com
# sucesso. O `construir` (sem segredo) faz o build e envia o `dist/` como artefato. O `migrar` aplica as migrações com a URL do
# banco, sem o token da Cloudflare (A-11). O `publicar` roda no environment `tst` ou
# `producao` (segredos separados, só nos passos do wrangler), publica o Worker e confere a fumaça (página, `/sw.js` e um
# livro, com os cabeçalhos de segurança do AD-003). Se a fumaça falha depois de publicar, volta a
# versão anterior (`wrangler rollback`).
#
# Inerte até o Nível 2 do /preparar: enquanto a variável DEPLOY_ATIVO do repositório não for 'true', nenhum job roda.
name: deploy

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-${{ github.ref_name }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  conferir:
    if: ${{ vars.DEPLOY_ATIVO == 'true' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/desenvolvimento') }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
    steps:
      - name: Conferir o CI verde no commit disparado
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.sha }}
          RAMO: ${{ github.ref_name }}
        run: |
          run_ci=$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/ci.yml/runs?head_sha=${SHA}&branch=${RAMO}&event=push&per_page=1" --jq '.workflow_runs[0] // empty | "\(.status) \(.conclusion) \(.html_url)"')
          if [ -z "$run_ci" ]; then
            echo "::error title=Sem CI para este commit::Nenhum run do workflow ci num push à ${RAMO} para ${SHA}. Espere o CI do push terminar e dispare de novo."
            exit 1
          fi
          read -r estado conclusao url <<< "$run_ci"
          if [ "$estado" != "completed" ] || [ "$conclusao" != "success" ]; then
            echo "::error title=CI não está verde::O ci de ${SHA} está ${estado}/${conclusao} (${url}). Só se publica commit com o CI concluído com sucesso."
            exit 1
          fi
          echo "CI verde para ${SHA}: ${url}"

  construir:
    needs: conferir
    if: ${{ vars.DEPLOY_ATIVO == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Sem segredo e sem environment: instala e constrói com as dependências do build, que nunca veem o token (SEC-001).
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build (antes de tocar em qualquer coisa publicada)
        run: pnpm build
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist
          if-no-files-found: error
          retention-days: 1

  # A migração roda num job próprio (A-11): o código das dependências de `pnpm migrar` (node-pg-migrate, pg e outros)
  # nunca divide o job nem o `node_modules` com o token da Cloudflare. A URL do banco (papel dono) vive só neste passo.
  # As migrações são aditivas: se a fumaça falhar depois, a volta do Worker não precisa desfazer o banco.
  migrar:
    needs: construir
    if: ${{ vars.DEPLOY_ATIVO == 'true' }}
    runs-on: ubuntu-latest
    environment:
      name: ${{ github.ref == 'refs/heads/main' && 'producao' || 'tst' }}
      url: ${{ github.ref == 'refs/heads/main' && 'https://minhajornada.ljssoftware.com.br' || 'https://minhajornada-tst.ljssoftware.com.br' }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - run: pnpm install --frozen-lockfile --ignore-scripts
      # A conferência do papel roda a cada deploy: papel alterado depois no Console do Neon para o deploy (A-18). Com schema
      # e search_path fixos, nenhum schema criado pelo papel conferido sombreia a função (A-19).
      - name: Migrar o banco e conferir o papel do app antes de publicar
        env:
          DATABASE_URL_DONO: ${{ secrets.DATABASE_URL_DONO }}
        run: |
          pnpm migrar
          PGOPTIONS='-c search_path=pg_catalog' psql "$DATABASE_URL_DONO" -v ON_ERROR_STOP=1 -c "SELECT public.conferir_papel_app('mj_app')"

  publicar:
    needs: [construir, migrar]
    if: ${{ vars.DEPLOY_ATIVO == 'true' }}
    runs-on: ubuntu-latest
    environment:
      name: ${{ github.ref == 'refs/heads/main' && 'producao' || 'tst' }}
      url: ${{ github.ref == 'refs/heads/main' && 'https://minhajornada.ljssoftware.com.br' || 'https://minhajornada-tst.ljssoftware.com.br' }}
    timeout-minutes: 15
    env:
      SHA: ${{ github.sha }}
      URL_PUBLICA: ${{ github.ref == 'refs/heads/main' && 'https://minhajornada.ljssoftware.com.br' || 'https://minhajornada-tst.ljssoftware.com.br' }}
      # Produção usa o Worker do topo do wrangler.jsonc; o staging, `env.tst`.
      WRANGLER_ENV: ${{ github.ref == 'refs/heads/main' && '--env=' || '--env=tst' }}
    # O token da Cloudflare fica só nos passos do wrangler (SEC-001); aqui só entra o wrangler, sem scripts de
    # dependência e sem cache do pnpm (SEC-004).
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist

      - name: 1. Publicar o Worker (só assets)
        id: publicar
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        # shellcheck disable=SC2086
        run: pnpm exec wrangler deploy ${WRANGLER_ENV}

      - name: 2. Fumaça do site publicado
        run: |
          curl -fsS --retry 5 --retry-all-errors --retry-delay 3 -o /dev/null "${URL_PUBLICA}/"
          livro="/livros/$(ls dist/livros | head -1)"
          for caminho in "/" "/sw.js" "${livro}"; do
            cabecalhos="$(curl -fsS --retry 5 --retry-all-errors --retry-delay 3 -D - -o /dev/null "${URL_PUBLICA}${caminho}")"
            for exigido in "^content-security-policy:.*default-src 'self'" "^content-security-policy:.*object-src 'none'" "^content-security-policy:.*frame-ancestors 'none'" '^x-content-type-options: *nosniff' '^referrer-policy: *same-origin'; do
              if ! grep -qi -- "${exigido}" <<< "${cabecalhos}"; then
                echo "::error title=Fumaça falhou::${caminho} não traz o cabeçalho esperado: ${exigido}"
                exit 1
              fi
            done
          done

      - name: 3. Fumaça da API sem sessão (FUN-147, FUN-151)
        run: |
          cabecalhos="$(curl -sS --retry 5 --retry-all-errors --retry-delay 3 -D - -o /dev/null "${URL_PUBLICA}/api/resumos/1")"
          status="$(head -n 1 <<< "${cabecalhos}" | tr -d '\r' | cut -d ' ' -f 2)"
          if [ "${status}" != "401" ]; then
            echo "::error title=Fumaça da API falhou::/api/resumos/1 sem sessão devia responder 401 e respondeu ${status:-nada}."
            exit 1
          fi
          if ! grep -qi -- '^cache-control:.*no-store' <<< "${cabecalhos}"; then
            echo "::error title=Fumaça da API falhou::/api/resumos/1 não traz cache-control: no-store."
            exit 1
          fi

      - name: Voltar a versão anterior do Worker
        if: ${{ failure() && steps.publicar.outcome == 'success' }}
        env:
          RUN: ${{ github.run_id }}-${{ github.run_attempt }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        # shellcheck disable=SC2086
        run: |
          pnpm exec wrangler rollback ${WRANGLER_ENV} --message "Fumaça falhou no deploy ${RUN}"
          echo "::error title=Deploy revertido::A fumaça falhou e o Worker voltou à versão anterior (deploy ${RUN})."
          exit 1
