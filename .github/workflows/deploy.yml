# Deploy do leitor (PWA estática, AD-001). ÚNICO lugar com `wrangler deploy`.
#
# Gatilho: só manual (workflow_dispatch). Rodado na `desenvolvimento`, publica o staging (tst); rodado na `main`,
# publica a produção. Publica a ponta da branch no momento do disparo (github.sha).
# Disparo: `gh workflow run deploy --ref desenvolvimento` (tst) ou `--ref main` (produção).
#
# O job `conferir` (sem segredo) só deixa seguir se o workflow `ci` desse SHA, num push à mesma branch, terminou com
# sucesso. O `publicar` roda no environment `tst` ou `producao` (segredos separados), faz o build, publica o Worker
# e confere a fumaça (página no ar e cabeçalhos de segurança do AD-003). Se a fumaça falha depois de publicar, volta a
# versão anterior (`wrangler rollback`).
#
# Inerte até o Nível 2 do /preparar: enquanto a variável DEPLOY_ATIVO do repositório não for 'true', nenhum job roda.
name: deploy

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-${{ github.ref_name }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  conferir:
    if: ${{ vars.DEPLOY_ATIVO == 'true' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/desenvolvimento') }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
    steps:
      - name: Conferir o CI verde no commit disparado
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.sha }}
          RAMO: ${{ github.ref_name }}
        run: |
          run_ci=$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/ci.yml/runs?head_sha=${SHA}&branch=${RAMO}&event=push&per_page=1" --jq '.workflow_runs[0] // empty | "\(.status) \(.conclusion) \(.html_url)"')
          if [ -z "$run_ci" ]; then
            echo "::error title=Sem CI para este commit::Nenhum run do workflow ci num push à ${RAMO} para ${SHA}. Espere o CI do push terminar e dispare de novo."
            exit 1
          fi
          read -r estado conclusao url <<< "$run_ci"
          if [ "$estado" != "completed" ] || [ "$conclusao" != "success" ]; then
            echo "::error title=CI não está verde::O ci de ${SHA} está ${estado}/${conclusao} (${url}). Só se publica commit com o CI concluído com sucesso."
            exit 1
          fi
          echo "CI verde para ${SHA}: ${url}"

  publicar:
    needs: conferir
    if: ${{ vars.DEPLOY_ATIVO == 'true' }}
    runs-on: ubuntu-latest
    environment:
      name: ${{ github.ref == 'refs/heads/main' && 'producao' || 'tst' }}
      url: ${{ github.ref == 'refs/heads/main' && 'https://minhajornada.ljssoftware.com.br' || 'https://minhajornada-tst.ljssoftware.com.br' }}
    timeout-minutes: 15
    env:
      SHA: ${{ github.sha }}
      URL_PUBLICA: ${{ github.ref == 'refs/heads/main' && 'https://minhajornada.ljssoftware.com.br' || 'https://minhajornada-tst.ljssoftware.com.br' }}
      # Produção usa o Worker do topo do wrangler.jsonc; o staging, `env.tst`.
      WRANGLER_ENV: ${{ github.ref == 'refs/heads/main' && '--env=' || '--env=tst' }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: 1. Build (antes de tocar em qualquer coisa publicada)
        run: pnpm build

      - name: 2. Publicar o Worker (só assets)
        id: publicar
        # shellcheck disable=SC2086
        run: pnpm exec wrangler deploy ${WRANGLER_ENV}

      - name: 3. Fumaça do site publicado
        run: |
          curl -fsS --retry 5 --retry-all-errors --retry-delay 3 -o /dev/null "${URL_PUBLICA}/"
          cabecalhos="$(curl -fsS --retry 5 --retry-all-errors --retry-delay 3 -D - -o /dev/null "${URL_PUBLICA}/")"
          for exigido in '^content-security-policy:' '^x-content-type-options: *nosniff' '^referrer-policy: *same-origin'; do
            if ! grep -qi -- "${exigido}" <<< "${cabecalhos}"; then
              echo "::error title=Fumaça falhou::O site publicado não traz o cabeçalho esperado: ${exigido}"
              exit 1
            fi
          done

      - name: Voltar a versão anterior do Worker
        if: ${{ failure() && steps.publicar.outcome == 'success' }}
        env:
          RUN: ${{ github.run_id }}-${{ github.run_attempt }}
        # shellcheck disable=SC2086
        run: |
          pnpm exec wrangler rollback ${WRANGLER_ENV} --message "Fumaça falhou no deploy ${RUN}"
          echo "::error title=Deploy revertido::A fumaça falhou e o Worker voltou à versão anterior (deploy ${RUN})."
          exit 1
