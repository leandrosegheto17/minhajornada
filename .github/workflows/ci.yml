name: ci

on:
  pull_request:
  push:
    branches: [main, desenvolvimento]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  base:
    runs-on: ubuntu-latest
    # Banco dos testes do servidor (AD-022): o superusuário do serviço cria e apaga os bancos `teste_<hex>` (FUN-141 a
    # FUN-175). A senha é só deste serviço descartável, nunca de um ambiente real.
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: mj_dono
          POSTGRES_PASSWORD: senha-so-do-ci
          POSTGRES_DB: minhajornada
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U mj_dono -d minhajornada"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
        env:
          DATABASE_URL_TESTE: postgresql://mj_dono:senha-so-do-ci@127.0.0.1:5432/minhajornada

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm build:e2e
      - name: e2e (Playwright sobre o build)
        run: pnpm e2e
        env:
          CI: 'true'
